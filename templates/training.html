<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 상태</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/training.css') }}">
</head>
<body>
<header class="top">
  <h1>학습 상태</h1>
  <span class="muted" id="clock">확인 중</span>
</header>
<main>
  <section class="lamp" id="lamp" data-state="unknown" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <div class="lamp-title" id="lampTitle">확인 중</div>
      <div class="lamp-sub" id="lampSub"></div>
    </div>
  </section>

  <div class="jobs" id="jobs"></div>

  <div class="charts" id="charts" hidden>
    <section class="panel">
      <h2>학습 손실</h2>
      <p class="muted">낮을수록 좋습니다.</p>
      <div class="chart" id="chartLoss"></div>
    </section>
    <section class="panel">
      <h2>검증 Macro-F1</h2>
      <p class="muted">1에 가까울수록 좋습니다. 학습에 쓰지 않은 검증 분할 기준입니다.</p>
      <div class="chart" id="chartF1"></div>
    </section>
  </div>

  <section class="panel" id="metricsPanel" hidden>
    <h2>최종 시험 결과</h2>
    <p class="muted" id="metricsNote"></p>
    <div id="metricsBody"></div>
  </section>
</main>
<script src="{{ url_for('static', filename='js/training.js') }}"></script>
</body>
</html>
